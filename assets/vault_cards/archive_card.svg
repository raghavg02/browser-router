<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e14"/>
      <stop offset="100%" stop-color="#141009"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="#45331a" stroke-width="1.5"/>
  
  <rect x="295" y="16" width="85" height="22" rx="6" fill="#78350f" stroke="#b45309" stroke-width="1"/>
  <text x="337" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle" letter-spacing="0.5">ARCHIVE</text>
  
  <!-- Box / Package Graphic -->
  <g transform="translate(135, 65)">
    <!-- Main Box -->
    <rect x="0" y="30" width="130" height="150" rx="10" fill="#292014" stroke="#78350f" stroke-width="2"/>
    <!-- Box Lid -->
    <rect x="-10" y="15" width="150" height="25" rx="6" fill="#3d2c18" stroke="#b45309" stroke-width="2"/>
    <!-- Vertical Zipper Stripe -->
    <rect x="55" y="40" width="20" height="140" fill="#1c1409"/>
    <line x1="60" y1="50" x2="70" y2="50" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="70" x2="70" y2="70" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="90" x2="70" y2="90" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="110" x2="70" y2="110" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="130" x2="70" y2="130" stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Zipper Head -->
    <rect x="52" y="145" width="26" height="22" rx="4" fill="url(#amberGrad)"/>
    <circle cx="65" cy="156" r="3" fill="#141009"/>
  </g>
</svg>