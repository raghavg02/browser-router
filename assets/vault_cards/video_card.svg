<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1828"/>
      <stop offset="100%" stop-color="#110d18"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="#3b2b52" stroke-width="1.5"/>
  
  <rect x="295" y="16" width="85" height="22" rx="6" fill="#4c1d95" stroke="#6d28d9" stroke-width="1"/>
  <text x="337" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ddd6fe" text-anchor="middle" letter-spacing="0.5">VIDEO</text>
  
  <!-- Filmstrip -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="280" height="150" rx="12" fill="#181124" stroke="#5b21b6" stroke-width="2"/>
    <!-- Film Holes top & bottom -->
    <rect x="20" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="60" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="100" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="140" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="180" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="220" y="12" width="20" height="14" rx="3" fill="#0f0a17"/>
    
    <rect x="20" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="60" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="100" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="140" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="180" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    <rect x="220" y="124" width="20" height="14" rx="3" fill="#0f0a17"/>
    
    <!-- Play button in center -->
    <circle cx="140" cy="75" r="30" fill="url(#violetGrad)"/>
    <polygon points="132,62 156,75 132,88" fill="#ffffff"/>
  </g>
</svg>